name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_DEPLOY: 'true'

      - name: Export and validate domain artifact
        run: |
          npm run build:pages
          test -f pages-dist/index.html
          test -f pages-dist/sitemap.xml
          test -f pages-dist/robots.txt
          grep -qx 'www.marinoxmetalurgica.com.br' pages-dist/CNAME
          test -d pages-dist/_next/static/css
          ! grep -q 'tuned-civet-0855' pages-dist/index.html
          ! grep -q '/marinox/_next' pages-dist/index.html
