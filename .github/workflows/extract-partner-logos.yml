name: Extract Partner Logos

on:
  push:
    paths:
      - '.github/workflows/extract-partner-logos.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract official logo candidates
        shell: bash
        run: |
          python - <<'PY'
          import os, re, json, mimetypes
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          sites = {
              'habitte': 'https://www.habitteengenharia.com.br/',
              'lar': 'https://www.larconstrutora.com.br/sobre',
              'retrofit': 'https://retrofitengenharia.com.br/',
              'ramfej': 'https://ramfej.com.br/',
              'saeng': 'https://saeng.com.br/',
              'baggio-carvalho': 'https://baggioecarvalho.com.br/',
          }

          os.makedirs('logos', exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0'})
          manifest = {}

          def ext_from(resp, url):
              path = urlparse(url).path.lower()
              for ext in ('.svg','.png','.webp','.jpg','.jpeg'):
                  if path.endswith(ext): return ext
              ctype = resp.headers.get('content-type','').split(';')[0]
              return mimetypes.guess_extension(ctype) or '.bin'

          for key, page_url in sites.items():
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              candidates = []

              # images and SVG/object references
              for tag in soup.find_all(['img','source','object','image']):
                  vals=[]
                  for attr in ('src','data-src','data-lazy-src','href','data'):
                      v=tag.get(attr)
                      if v: vals.append(v)
                  for attr in ('srcset','data-srcset'):
                      v=tag.get(attr)
                      if v:
                          vals += [x.strip().split(' ')[0] for x in v.split(',') if x.strip()]
                  text=' '.join(str(tag.get(a,'')) for a in ('alt','title','class','id')).lower()
                  for v in vals:
                      u=urljoin(page_url,v)
                      score=0
                      lu=u.lower()
                      if 'logo' in lu: score+=20
                      if 'logo' in text: score+=20
                      if key.replace('-','') in lu.replace('-','').replace('_',''): score+=12
                      if any(w in text for w in (key, key.replace('-',' '), 'marca','brand','header')): score+=8
                      if any(x in lu for x in ('favicon','icon-','apple-touch','iso-','certifica')): score-=20
                      if re.search(r'\.(svg|png|webp|jpe?g)(\?|$)', lu): score+=4
                      candidates.append((score,u,text))

              # referenced assets in raw HTML/CSS
              for m in re.findall(r'https?://[^\"\'\s)<>]+', r.text):
                  lm=m.lower()
                  if 'logo' in lm and re.search(r'\.(svg|png|webp|jpe?g)(\?|$)', lm):
                      candidates.append((25,m,'raw-html'))

              # dedupe, highest score first
              seen=set(); ranked=[]
              for score,u,text in sorted(candidates, reverse=True):
                  if u in seen: continue
                  seen.add(u); ranked.append((score,u,text))

              manifest[key]={'page':page_url,'candidates':[]}
              saved=0
              for score,u,text in ranked[:20]:
                  try:
                      rr=session.get(u, timeout=30)
                      if rr.status_code != 200 or not rr.content: continue
                      ctype=rr.headers.get('content-type','')
                      if not (ctype.startswith('image/') or u.lower().endswith('.svg')): continue
                      ext=ext_from(rr,u)
                      fn=f'{key}-{saved+1:02d}{ext}'
                      with open(os.path.join('logos',fn),'wb') as f: f.write(rr.content)
                      manifest[key]['candidates'].append({'file':fn,'score':score,'url':u,'content_type':ctype,'bytes':len(rr.content)})
                      saved += 1
                      if saved >= 8: break
                  except Exception as e:
                      pass

          with open('logos/manifest.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload logos
        uses: actions/upload-artifact@v4
        with:
          name: logos-parceiros-oficiais
          path: logos
          if-no-files-found: error
